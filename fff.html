<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doris' House Of Fashion | Ghana, Kumasi</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #fefaf5;
      color: #1e1e2a;
      line-height: 1.6;
    }

    /* header + navigation */
    header {
      background: #0b0b0f;
      color: #f5e9da;
      padding: 1.2rem 5%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #c9a77b;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo i {
      color: #d4af7a;
      font-size: 2.2rem;
    }

    .logo span {
      color: #e9d7c1;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      list-style: none;
      font-weight: 500;
      font-size: 1.1rem;
    }

    .nav-links a {
      color: #f0e3d5;
      text-decoration: none;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
      padding-bottom: 4px;
    }

    .nav-links a:hover {
      border-bottom-color: #c9a77b;
      color: #ffffff;
    }

    /* main container */
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 5%;
    }

    /* hero section */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem;
      background: linear-gradient(145deg, #fff7ef, #f3e7db);
      border-radius: 40px;
      padding: 2.5rem 2rem;
      margin: 1.5rem 0 3rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2d3c0;
    }

    .hero-text {
      flex: 1 1 300px;
    }

    .hero-text h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      color: #1e1e2a;
      margin-bottom: 1rem;
    }

    .hero-text h1 i {
      color: #b58b5c;
      margin-right: 10px;
    }

    .hero-text p {
      font-size: 1.2rem;
      color: #3a2e28;
      margin-bottom: 2rem;
    }

    .contact-badge {
      background: #0b0b0f;
      color: #f3e3d2;
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    .contact-badge i {
      color: #d4af7a;
    }

    .hero-image {
      flex: 1 1 300px;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 18px 30px -8px rgba(0, 0, 0, 0.25);
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 1 / 0.8;
    }

    /* page title & 10 page hint */
    .page-showcase {
      text-align: center;
      margin: 3rem 0 1.5rem;
    }

    .page-showcase h2 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #1e1e2a;
      letter-spacing: -0.5px;
    }

    .page-showcase h2 i {
      color: #b58b5c;
      margin-right: 12px;
    }

    .page-showcase p {
      color: #5f4e3c;
      font-size: 1.2rem;
      background: #f3e7db;
      display: inline-block
